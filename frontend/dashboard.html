<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TG BOT HUB</title>
    <meta name="description" content="TG BOT HUB Dashboard - Manage your Telegram bots">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Additional dashboard-specific styles */
        .welcome-card {
            background: var(--primary-gradient);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            color: white;
            position: relative;
            overflow: hidden;
        }
        .welcome-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .welcome-card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: 10%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .welcome-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .welcome-text {
            opacity: 0.9;
            font-size: 0.9rem;
            max-width: 400px;
            position: relative;
        }
        
        /* Theme toggle button */
        .theme-toggle-btn {
            cursor: pointer;
        }

        /* Notification dot pulse */
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .notification-dot.pulse {
            animation: pulse-dot 2s infinite;
        }

        /* Quick stat improvements */
        .stat-card .stat-icon.gradient-purple { background: rgba(108,92,231,0.2); color: var(--primary-light); }
        .stat-card .stat-icon.gradient-green { background: rgba(0,184,148,0.2); color: var(--success); }
        .stat-card .stat-icon.gradient-pink { background: rgba(253,121,168,0.2); color: var(--accent); }
        .stat-card .stat-icon.gradient-blue { background: rgba(116,185,255,0.2); color: var(--info); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon">T</div>
                <span class="sidebar-logo">TG BOT HUB</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a class="nav-item active" data-page="overview" href="#">
                        <span class="nav-icon">🏠</span>
                        <span>Overview</span>
                    </a>
                    <a class="nav-item" data-page="bots" href="#">
                        <span class="nav-icon">🤖</span>
                        <span>My Bots</span>
                    </a>
                    <a class="nav-item" data-page="commands" href="#">
                        <span class="nav-icon">⚡</span>
                        <span>Commands</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <a class="nav-item" data-page="analytics" href="#">
                        <span class="nav-icon">📊</span>
                        <span>Analytics</span>
                    </a>
                    <a class="nav-item" data-page="logs" href="#">
                        <span class="nav-icon">📝</span>
                        <span>Activity Logs</span>
                    </a>
                    <a class="nav-item" data-page="marketplace" href="#">
                        <span class="nav-icon">🛒</span>
                        <span>Marketplace</span>
                    </a>
                    <a class="nav-item" data-page="plugins" href="#">
                        <span class="nav-icon">🔌</span>
                        <span>Plugins</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Settings</div>
                    <a class="nav-item" data-page="profile" href="#">
                        <span class="nav-icon">👤</span>
                        <span>Profile</span>
                    </a>
                    <a class="nav-item" data-page="settings" href="#">
                        <span class="nav-icon">⚙️</span>
                        <span>Settings</span>
                    </a>
                    <a class="nav-item admin-only" data-page="users" href="#" style="display:none;">
                        <span class="nav-icon">👥</span>
                        <span>User Management</span>
                    </a>
                    <a class="nav-item admin-only" data-page="security" href="#" style="display:none;">
                        <span class="nav-icon">🛡️</span>
                        <span>Security</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">U</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">User</div>
                        <div class="sidebar-user-role">Loading...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                        ☰
                    </button>
                    <div>
                        <h1 class="topbar-title" style="font-size:1rem;">Dashboard Overview</h1>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="topbar-search">
                        <span class="topbar-search-icon">🔍</span>
                        <input type="text" id="global-search" placeholder="Search bots, commands, settings...">
                    </div>
                    <button class="topbar-btn theme-toggle theme-toggle-btn" onclick="ThemeManager.toggle()" title="Toggle Theme">
                        🌙
                    </button>
                    <button class="topbar-btn notification-btn" title="Notifications">
                        🔔
                        <span class="notification-dot pulse"></span>
                    </button>
                    <button class="topbar-btn logout-btn" title="Logout">
                        🚪
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Dashboard Overview</h1>
                        <p class="page-subtitle">Welcome back! Here's your summary.</p>
                    </div>
                </div>
                <div id="page-content">
                    <div class="loading-overlay" style="min-height:400px;">
                        <div class="spinner spinner-lg"></div>
                        <p>Loading dashboard...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
