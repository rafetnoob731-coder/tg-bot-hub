<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TG BOT HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(0, 206, 201, 0.1) 0%, transparent 50%);
            animation: gradientMove 15s ease infinite;
            pointer-events: none;
        }
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .auth-logo-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            font-weight: 800;
        }
        .auth-logo-text {
            font-size: 1.4rem;
            font-weight: 800;
        }
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .auth-error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--danger);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .auth-success {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid rgba(0, 184, 148, 0.3);
            color: var(--success);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: var(--primary-light);
            font-weight: 600;
        }
        .theme-toggle-auth {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
            transition: var(--transition-base);
        }
        .theme-toggle-auth:hover {
            border-color: var(--primary);
        }
        @media (max-width: 768px) {
            .auth-container {
                max-width: 100%;
                margin: 1rem;
                padding: 1.5rem;
            }
            .auth-title {
                font-size: 1.2rem;
            }
            .auth-logo-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
            .auth-logo-text {
                font-size: 1.1rem;
            }
            .theme-toggle-auth {
                top: 0.5rem;
                right: 0.5rem;
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .form-input {
                font-size: 16px !important;
            }
        }
        @media (max-width: 480px) {
            .auth-container {
                padding: 1rem;
                margin: 0.5rem;
            }
            .auth-title {
                font-size: 1.1rem;
            }
        }
        @media (hover: none) and (pointer: coarse) {
            .auth-container {
                -webkit-tap-highlight-color: rgba(108, 92, 231, 0.3);
            }
        }
        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-tertiary);
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <button class="theme-toggle-auth theme-toggle" onclick="ThemeManager.toggle()">🌙</button>
    
    <div class="auth-container animate-scale-in">
        <div class="auth-logo">
            <div class="auth-logo-icon">T</div>
            <span class="auth-logo-text">TG BOT HUB</span>
        </div>
        <h1 class="auth-title">Create Your Account</h1>
        <p class="auth-subtitle">Start managing your Telegram bots professionally</p>
        
        <div class="auth-error" id="auth-error"></div>
        <div class="auth-success" id="auth-success"></div>
        
        <form id="register-form" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" id="username" placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Full Name (optional)</label>
                <input class="form-input" id="full-name" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" id="email" type="email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" id="password" type="password" placeholder="Create a strong password" required autocomplete="new-password">
                <div class="password-strength">
                    <div class="password-strength-bar" id="password-strength-bar"></div>
                </div>
                <small class="text-muted">At least 8 characters with uppercase, lowercase, number & special char</small>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input class="form-input" id="confirm-password" type="password" placeholder="Confirm your password" required>
            </div>
            <div style="margin-bottom:1.5rem;">
                <label class="form-checkbox">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the <a href="#" onclick="alert('Terms of Service (demo)')">Terms of Service</a> and <a href="#" onclick="alert('Privacy Policy (demo)')">Privacy Policy</a></span>
                </label>
            </div>
            <button type="submit" class="btn btn-primary w-full" id="register-btn">
                Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const pw = this.value;
            const bar = document.getElementById('password-strength-bar');
            let strength = 0;
            
            if (pw.length >= 8) strength += 25;
            if (pw.match(/[A-Z]/)) strength += 25;
            if (pw.match(/[a-z]/)) strength += 15;
            if (pw.match(/[0-9]/)) strength += 20;
            if (pw.match(/[!@#$%^&*(),.?":{}|<>]/)) strength += 15;
            
            bar.style.width = strength + '%';
            
            if (strength < 40) {
                bar.style.background = 'var(--danger)';
            } else if (strength < 70) {
                bar.style.background = 'var(--warning)';
            } else {
                bar.style.background = 'var(--success)';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('auth-error');
            const successDiv = document.getElementById('auth-success');
            
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('full-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const terms = document.getElementById('terms').checked;
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!username || !email || !password) {
                errorDiv.textContent = 'Please fill in all required fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!terms) {
                errorDiv.textContent = 'Please agree to the Terms of Service';
                errorDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            
            try {
                const result = await api.register(username, email, password, fullName);
                
                if (result.success) {
                    successDiv.textContent = 'Account created! Redirecting to dashboard...';
                    successDiv.style.display = 'block';
                    UI.showToast('Welcome to TG BOT HUB! 🎉', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    const errors = result.errors || ['Registration failed'];
                    errorDiv.textContent = errors.join(', ');
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = e.message || 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
            }
            
            btn.disabled = false;
            btn.textContent = 'Create Account';
        });
    </script>
</body>
</html>
