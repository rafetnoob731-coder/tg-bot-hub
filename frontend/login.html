<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TG BOT HUB</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(0, 206, 201, 0.1) 0%, transparent 50%);
            animation: gradientMove 15s ease infinite;
            pointer-events: none;
        }
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .auth-logo-icon {
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            font-weight: 800;
        }
        .auth-logo-text {
            font-size: 1.4rem;
            font-weight: 800;
        }
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .auth-error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--danger);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: var(--primary-light);
            font-weight: 600;
        }
        .theme-toggle-auth {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
            transition: var(--transition-base);
        }
        .theme-toggle-auth:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <button class="theme-toggle-auth theme-toggle" onclick="ThemeManager.toggle()">🌙</button>
    
    <div class="auth-container animate-scale-in">
        <div class="auth-logo">
            <div class="auth-logo-icon">T</div>
            <span class="auth-logo-text">TG BOT HUB</span>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>
        
        <div class="auth-error" id="auth-error"></div>
        
        <form id="login-form" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input class="form-input" id="username" placeholder="Enter your username or email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <div class="flex justify-between items-center" style="margin-bottom:1.5rem;">
                <label class="form-checkbox">
                    <input type="checkbox" id="remember-me">
                    <span>Remember me</span>
                </label>
                <a href="#" onclick="alert('Password reset request sent to your email (demo)')" style="font-size:0.85rem;">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-full" id="login-btn">
                Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="/register.html">Create one</a>
        </div>
    </div>

    <div class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('auth-error');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorDiv.style.display = 'none';
            
            try {
                const result = await api.login(username, password);
                
                if (result.success) {
                    UI.showToast('Welcome back! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    const errors = result.errors || ['Invalid credentials'];
                    errorDiv.textContent = errors.join(', ');
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = e.message || 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
            }
            
            btn.disabled = false;
            btn.textContent = 'Sign In';
        });

        // Demo credentials hint
        setTimeout(() => {
            if (!localStorage.getItem('tgbh_demo_hint_shown')) {
                UI.showToast('Demo: admin / Admin123!', 'info', 5000);
                localStorage.setItem('tgbh_demo_hint_shown', 'true');
            }
        }, 500);
    </script>
</body>
</html>
